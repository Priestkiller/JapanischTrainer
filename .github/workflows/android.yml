name: Android
on:
  workflow_dispatch:
  push:
    paths: ['mobile/**', '.github/workflows/android.yml']
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Course and progress tests
        run: node --test mobile/tests/core.test.mjs
      - name: Prepare original resources and verified speech library
        run: |
          python -m pip install Pillow==12.3.0
          python mobile/tools/prepare_assets.py --download-library
      - name: Build and lint Android APK
        working-directory: mobile
        run: gradle --no-daemon :app:assembleRelease :app:assembleDebug :app:assembleDebugAndroidTest :app:lintRelease
      - name: Allow disposable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android UI, persistence and real offline speech inference
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          ram-size: 4096M
          disk-size: 6000M
          disable-animations: true
          script: cd mobile && gradle --no-daemon :app:connectedDebugAndroidTest
      - name: Upload APKs and actual test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: |
            mobile/app/build/outputs/apk/release/*.apk
            mobile/app/build/outputs/apk/debug/*.apk
            mobile/app/build/reports/
            mobile/app/build/outputs/androidTest-results/
          retention-days: 7
